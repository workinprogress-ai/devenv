# Issue Type Configuration
# Defines the issue-type vocabulary and parent/child hierarchy used by the
# issue tools. Types are applied through the provider's native issue-type
# field, matched by name (case-insensitive; aliases resolve onto these names).
# Provider-side type identifiers are discovered at run time (see `issue-types`).

types:
  - name: Bug
    description: "A bug or defect that needs fixing"
    child_of: [Epic]

  - name: Feature
    description: "A new feature or enhancement"
    child_of: [Epic]

  - name: Task
    description: "A task or work item"
    child_of: [Epic, Feature, Bug, Task]

  - name: Epic
    description: "Long-lived orchestration issue coordinating work across multiple repos or efforts — not for single deliverables (use Feature)"
